# Reusable workflow: lint + script/integration tests.
# Called by ci.yml and release.yml. Also runnable via workflow_dispatch.
name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create fixture (Dockerfile in subdirectory)
        run: |
          mkdir -p testdata/subdir
          touch testdata/subdir/Dockerfile
      - name: Run script at repo root (finds subdir)
        id: resolve
        env:
          INPUT_DOCKERFILE: Dockerfile
          INPUT_WORKSPACE: ${{ github.workspace }}
          INPUT_SET_ENV: 'true'
          INPUT_VERBOSE: 'true'
          GITHUB_WORKSPACE: ${{ github.workspace }}
          OUTPUT_FILE: ${{ github.workspace }}/out.txt
          GITHUB_ENV_FILE: ${{ github.workspace }}/env.txt
        run: bash scripts/resolve-workflow-dir.sh
      - name: Verify outputs
        run: |
          out="${{ github.workspace }}/out.txt"
          test -f "$out"
          grep -q 'workflow-dir=' "$out"
          grep -q 'docker-build-context=' "$out"
          grep -q 'docker-file=' "$out"
          grep -q 'testdata' "$out"
      - name: Script succeeds without GITHUB_OUTPUT (act/Gitea compatibility)
        run: |
          # When GITHUB_OUTPUT is unset (act, some Gitea composite steps), script must still
          # exit 0 and emit legacy ::set-output:: so runners can capture from stdout.
          # Do not echo $out: it contains ::set-output/::set-env which GitHub runner would
          # parse and reject (set-env is disabled), failing the step.
          unset GITHUB_OUTPUT GITHUB_ENV OUTPUT_FILE GITHUB_ENV_FILE
          out=$(INPUT_VERBOSE=true GITHUB_WORKSPACE=${{ github.workspace }} bash scripts/resolve-workflow-dir.sh 2>&1)
          # Legacy outputs must be present
          echo "$out" | grep -q '::set-output name=workflow-dir::' || (echo "Missing legacy workflow-dir output"; exit 1)
          echo "$out" | grep -q '::set-output name=docker-build-context::' || (echo "Missing legacy docker-build-context output"; exit 1)
          echo "$out" | grep -q '::set-output name=docker-file::' || (echo "Missing legacy docker-file output"; exit 1)
          # Legacy output values must match resolution (same as file-override test)
          echo "$out" | grep -q '::set-output name=workflow-dir::./testdata/subdir' || (echo "Wrong workflow-dir value"; exit 1)
          echo "$out" | grep -q '::set-output name=docker-file::./testdata/subdir/Dockerfile' || (echo "Wrong docker-file value"; exit 1)
          # set-env defaults to true: legacy ::set-env:: must be present
          echo "$out" | grep -q '::set-env name=DOCKER_BUILD_CONTEXT::' || (echo "Missing legacy set-env (set-env default true)"; exit 1)
          echo "$out" | grep -q '::set-env name=DOCKER_FILE::' || (echo "Missing legacy DOCKER_FILE env"; exit 1)
          # Must not fail with ERROR when using legacy fallback
          if echo "$out" | grep -q 'ERROR:'; then echo "Script must not error when using legacy fallback"; exit 1; fi
          echo "Legacy outputs and env emitted with correct values (act/Gitea/hosted runner compatible)"
      - name: Script with set-env false does not emit set-env
        run: |
          unset GITHUB_OUTPUT GITHUB_ENV OUTPUT_FILE GITHUB_ENV_FILE
          out=$(INPUT_SET_ENV=false INPUT_VERBOSE=true GITHUB_WORKSPACE=${{ github.workspace }} bash scripts/resolve-workflow-dir.sh 2>&1)
          echo "$out" | grep -q '::set-output name=workflow-dir::' || (echo "Missing set-output"; exit 1)
          if echo "$out" | grep -q '::set-env'; then echo "Must not emit set-env when set-env=false"; exit 1; fi
          echo "set-env=false: no ::set-env:: emitted (OK)"
