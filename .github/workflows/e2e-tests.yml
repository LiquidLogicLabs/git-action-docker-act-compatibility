# E2E: run the action as users do (uses: ./). Validate outputs and env.
name: E2E tests

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (action as used)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false
      - name: Create fixture (Dockerfile in subdirectory)
        run: |
          mkdir -p testdata/subdir
          touch testdata/subdir/Dockerfile
      - name: Set workflow directory for act compatibility
        id: workdir
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          dockerfile: Dockerfile
          set-env: true
          verbose: true
      - name: Verify action outputs
        # These values come from `dirname` of a `find` over the CHECKED-OUT TREE, so on a
        # fork pull request the contributor controls them. Expanded directly into `run:`
        # they are pasted into the script before bash sees it, and a directory named with
        # backticks executes -- verified. Passing them through env: and quoting means bash
        # receives them as data.
        env:
          Z_WORKFLOW_DIR: ${{ steps.workdir.outputs.workflow-dir }}
          Z_BUILD_CONTEXT: ${{ steps.workdir.outputs.docker-build-context }}
          Z_DOCKER_FILE: ${{ steps.workdir.outputs.docker-file }}
        run: |
          test "$Z_WORKFLOW_DIR" = "./testdata/subdir"
          test "$Z_BUILD_CONTEXT" = "./testdata/subdir"
          test "$Z_DOCKER_FILE" = "./testdata/subdir/Dockerfile"
      - name: Verify env set for downstream steps
        run: |
          test "$DOCKER_BUILD_CONTEXT" = "./testdata/subdir"
          test "$DOCKER_FILE" = "./testdata/subdir/Dockerfile"
